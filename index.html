<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>M Sliding Puzzle</title>

<style>
body{
  font-family: Arial, sans-serif;
  text-align:center;
  background:#f4f4f4;
}

h1{ margin-top:20px; }

#instructions{
  width:340px;
  margin:10px auto;
  font-size:15px;
  background:#fff;
  padding:10px;
  border-radius:6px;
  border:1px solid #ddd;
}

#board{
  width:306px;
  height:306px;
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:3px;
  background:#333;
  padding:3px;
}

.tile{
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  font-size:40px;
  font-weight:bold;
}

.filled{
  background:#2e7d32;
  color:white;
  cursor:grab;
}

.empty{
  background:#fafafa;
}

#stats{
  font-size:18px;
}

#message{
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
  color:green;
}

button{
  padding:10px 18px;
  font-size:16px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>Sliding Puzzle — Form the Letter M</h1>

<div id="instructions">
<b>Instructions:</b><br>
Drag a green tile into the empty space.<br>
No clicking required — only drag and drop.
</div>

<div id="stats">
Moves: <span id="moves">0</span>
</div>

<div id="board"></div>

<button onclick="startGame()">Shuffle / Restart</button>

<div id="message"></div>

<script>

const board = document.getElementById("board");
const movesEl = document.getElementById("moves");
const message = document.getElementById("message");

let tiles = [];
let moves = 0;

const solvedPattern = [
  1,0,1,
  1,1,1,
  1,0,1
];

// Build board
function createBoard(){
  board.innerHTML="";

  tiles.forEach((val, i)=>{
    const div = document.createElement("div");
    div.className="tile";

    if(val === 0){
      div.classList.add("empty");

      div.ondragover = e => e.preventDefault();

      div.ondrop = (e) => {
        const fromIndex = parseInt(e.dataTransfer.getData("text"));
        moveTile(fromIndex);
      };

    } else {
      div.classList.add("filled");

      div.draggable = true;

      div.ondragstart = (e) => {
        e.dataTransfer.setData("text", i);
      };
    }

    board.appendChild(div);
  });
}

// movement rules
function getNeighbors(i){
  const n=[];
  const r=Math.floor(i/3), c=i%3;
  if(r>0) n.push(i-3);
  if(r<2) n.push(i+3);
  if(c>0) n.push(i-1);
  if(c<2) n.push(i+1);
  return n;
}

function moveTile(i){
  const emptyIndex = tiles.indexOf(0);

  if(getNeighbors(i).includes(emptyIndex)){
    [tiles[i], tiles[emptyIndex]] =
    [tiles[emptyIndex], tiles[i]];

    moves++;
    movesEl.innerText = moves;

    createBoard();
    checkWin();
  }
}

function checkWin(){
  if(tiles.join("") === solvedPattern.join("")){
    message.innerHTML =
      "🎉 Puzzle Complete!<br><br>" +
      "Your escape code is:<br><br>" +
      "<b style='font-size:34px; letter-spacing:3px;'>ARCHIVE</b>";
  }
}

// solvability
function isSolvable(arr){
  let inv=0;
  for(let i=0;i<arr.length;i++){
    for(let j=i+1;j<arr.length;j++){
      if(arr[i] && arr[j] && arr[i]>arr[j]) inv++;
    }
  }
  return inv%2===0;
}

function shuffle(){
  let arr;
  do{
    arr=[...solvedPattern];
    arr.sort(()=>Math.random()-0.5);
  }while(!isSolvable(arr) || arr.join()===solvedPattern.join());
  return arr;
}

function startGame(){
  moves=0;
  movesEl.innerText=moves;
  message.innerText="";
  tiles=shuffle();
  createBoard();
}

startGame();

</script>

</body>
</html>
