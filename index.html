<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>M Sliding Puzzle</title>

<style>
body{
  font-family: Arial, sans-serif;
  text-align:center;
  background:#f4f4f4;
  margin:0;
  padding:0;
}

h1{ margin-top:20px; }

#instructions{
  width:90%;
  max-width:340px;
  margin:10px auto;
  font-size:15px;
  background:#fff;
  padding:10px;
  border-radius:6px;
  border:1px solid #ddd;
}

#board{
  width:90vw;
  max-width:320px;
  aspect-ratio:1/1;
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:4px;
  background:#333;
  padding:4px;
  border-radius:8px;
}

.tile{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:bold;
  user-select:none;
  border-radius:6px;
  transition:0.15s;
}

.filled{
  background:#2e7d32;
  color:white;
}

.filled.selected{
  outline:4px solid #ffcc00;
  transform:scale(0.98);
}

.empty{
  background:#eaeaea;
}

#stats{
  font-size:18px;
  margin-top:10px;
}

#message{
  margin-top:15px;
  font-size:22px;
  font-weight:bold;
  color:green;
}

button{
  padding:10px 18px;
  font-size:16px;
  margin-top:10px;
  border:none;
  border-radius:6px;
}
</style>
</head>

<body>

<h1>Sliding Puzzle — Form the Letter M</h1>

<div id="instructions">
<b>Instructions:</b><br>
Tap a green tile to select it.<br>
Then tap the empty space next to it to move it.<br>
Goal: form the letter <b>M</b>.
</div>

<div id="stats">
Moves: <span id="moves">0</span>
</div>

<div id="board"></div>

<button onclick="startGame()">Shuffle / Restart</button>

<div id="message"></div>

<script>

const board = document.getElementById("board");
const movesEl = document.getElementById("moves");
const message = document.getElementById("message");

let tiles = [];
let moves = 0;
let selected = null;

const solvedPattern = [
  1,0,1,
  1,1,1,
  1,0,1
];

// build board
function createBoard(){
  board.innerHTML="";

  tiles.forEach((val, i)=>{
    const div = document.createElement("div");
    div.className="tile";

    if(val === 0){
      div.classList.add("empty");
      div.addEventListener("click", ()=>handleEmptyClick(i));
    } else {
      div.classList.add("filled");
      if(selected === i) div.classList.add("selected");
      div.addEventListener("click", ()=>selectTile(i));
    }

    board.appendChild(div);
  });
}

// select tile
function selectTile(i){
  selected = i;
  createBoard();
}

// move if valid
function handleEmptyClick(emptyIndex){
  if(selected === null) return;

  if(getNeighbors(selected).includes(emptyIndex)){
    [tiles[selected], tiles[emptyIndex]] =
    [tiles[emptyIndex], tiles[selected]];

    moves++;
    movesEl.innerText = moves;

    selected = null;

    createBoard();
    checkWin();
  }
}

// neighbors
function getNeighbors(i){
  const n=[];
  const r=Math.floor(i/3), c=i%3;
  if(r>0) n.push(i-3);
  if(r<2) n.push(i+3);
  if(c>0) n.push(i-1);
  if(c<2) n.push(i+1);
  return n;
}

// win condition
function checkWin(){
  if(tiles.join("") === solvedPattern.join("")){
    message.innerHTML =
      "🎉 Puzzle Complete!<br><br>" +
      "Your escape code is:<br><br>" +
      "<b style='font-size:34px; letter-spacing:3px;'>ARCHIVE</b>";
  }
}

// solvable shuffle
function isSolvable(arr){
  let inv=0;
  for(let i=0;i<arr.length;i++){
    for(let j=i+1;j<arr.length;j++){
      if(arr[i] && arr[j] && arr[i]>arr[j]) inv++;
    }
  }
  return inv%2===0;
}

function shuffle(){
  let arr;
  do{
    arr=[...solvedPattern];
    arr.sort(()=>Math.random()-0.5);
  }while(!isSolvable(arr) || arr.join()===solvedPattern.join());
  return arr;
}

// start
function startGame(){
  tiles = shuffle();
  moves = 0;
  selected = null;
  movesEl.innerText = moves;
  message.innerText = "";
  createBoard();
}

startGame();

</script>

</body>
</html>
